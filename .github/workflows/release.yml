name: Release

# Sürüm etiketi (ör. v1.0.23) gönderilince Windows ve Linux paketlerini derleyip GitHub Release'e yükler.
# Etiket, package.json içindeki sürümle aynı olmalı (v1.0.23 ↔ "version": "1.0.23").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Arayüzü derle
        run: npx vite build

      - name: Windows paketi
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux paketleri (AppImage ve deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
